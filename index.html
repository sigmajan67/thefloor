<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomiczne The Floor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #030712;
      color: #ffffff;
      overflow-x: hidden;
      user-select: none;
    }

    .font-teko {
      font-family: 'Teko', sans-serif;
    }

    .floor-screen-border {
      border: 4px solid #facc15;
      box-shadow: 0 0 25px rgba(250, 204, 21, 0.4), inset 0 0 15px rgba(0, 0, 0, 0.8);
    }

    .trapezoid-center {
      clip-path: polygon(5% 0%, 95% 0%, 100% 100%, 0% 100%);
      background: linear-gradient(180deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
    }

    .trapezoid-left {
      clip-path: polygon(0 0, 90% 0, 100% 100%, 0% 100%);
      background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
    }

    .trapezoid-right {
      clip-path: polygon(10% 0, 100% 0, 100% 100%, 0% 100%);
      background: linear-gradient(180deg, #1e3a8a 0%, #0f172a 100%);
    }

    .timer-box {
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
      border: 3px solid #3b82f6;
      box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }

    .timer-active {
      border-color: #facc15 !important;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.9) !important;
      animation: pulse-border 1s infinite alternate;
    }

    @keyframes pulse-border {
      from { box-shadow: 0 0 15px rgba(250, 204, 21, 0.6); }
      to { box-shadow: 0 0 35px rgba(250, 204, 21, 1); }
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">

  <!-- PRZEŁĄCZNIK WIDOKU -->
  <div class="fixed top-2 right-2 z-50 bg-slate-900/90 p-1.5 rounded-lg border border-slate-700 text-xs flex gap-2">
    <button id="btn-view-proj" onclick="setView('PROJEKTOR')" class="px-3 py-1.5 rounded font-bold bg-yellow-500 text-black">
      Projektor (Widownia)
    </button>
    <button id="btn-view-host" onclick="setView('HOST')" class="px-3 py-1.5 rounded font-bold text-gray-300 hover:text-white">
      Panel Prowadzącego
    </button>
  </div>

  <!-- 1. WIDOK PROJEKTORA -->
  <div id="view-projektor" class="flex-1 flex flex-col justify-between p-6 max-w-7xl mx-auto w-full relative">
    
    <div class="flex-1 flex items-center justify-center my-4">
      <div class="w-full max-w-4xl h-[55vh] bg-blue-950/60 floor-screen-border rounded-xl p-3 relative flex flex-col items-center justify-center overflow-hidden">
        <img id="proj-img" src="" alt="Struktura Anatomiczna" class="max-h-full max-w-full object-contain rounded shadow-2xl">
      </div>
    </div>

    <div class="w-full relative flex flex-col items-center">
      <div id="proj-category" class="trapezoid-center px-12 py-2 text-black font-extrabold text-xl md:text-2xl tracking-wider shadow-lg uppercase z-10">
        KATEGORIA
      </div>

      <div class="w-full grid grid-cols-2 gap-4 -mt-3 pt-2 px-2">
        <div id="box-player-a" class="timer-box p-4 rounded-l-2xl relative flex items-center justify-between">
          <div class="trapezoid-left absolute -top-4 left-0 px-6 py-1 border-t-2 border-yellow-400">
            <span id="proj-name-a" class="font-extrabold text-lg text-white tracking-widest">JAN</span>
          </div>
          <div id="proj-time-a" class="text-6xl md:text-8xl font-teko font-bold text-white mt-2 tracking-wider">
            45
          </div>
          <span id="badge-a" class="text-yellow-400 font-bold animate-pulse text-sm hidden">RUCH</span>
        </div>

        <div id="box-player-b" class="timer-box p-4 rounded-r-2xl relative flex items-center justify-between flex-row-reverse">
          <div class="trapezoid-right absolute -top-4 right-0 px-6 py-1 border-t-2 border-yellow-400">
            <span id="proj-name-b" class="font-extrabold text-lg text-white tracking-widest">WOJCIECH</span>
          </div>
          <div id="proj-time-b" class="text-6xl md:text-8xl font-teko font-bold text-blue-400 mt-2 tracking-wider">
            45
          </div>
          <span id="badge-b" class="text-yellow-400 font-bold animate-pulse text-sm hidden">RUCH</span>
        </div>
      </div>
    </div>

  </div>

  <!-- 2. WIDOK PROWADZĄCEGO -->
  <div id="view-host" class="flex-1 p-6 max-w-2xl mx-auto w-full flex flex-col justify-between hidden">
    <div>
      <h1 class="text-xl font-bold text-yellow-400 mb-4 text-center border-b border-slate-800 pb-2">PANEL ARBITRA / PROWADZĄCEGO</h1>
      
      <div class="bg-slate-900 border-2 border-yellow-500/50 rounded-xl p-4 mb-4 text-center">
        <span class="text-xs text-gray-400 uppercase tracking-widest block mb-1">Poprawna Odpowiedź:</span>
        <div id="host-answer" class="text-2xl font-black text-green-400">---</div>
        <span id="host-category" class="text-xs text-yellow-500 mt-2 block">---</span>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4 text-center">
        <div id="host-card-a" class="p-4 rounded-lg border bg-slate-900 border-slate-800">
          <div id="host-name-a" class="text-sm font-bold">JAN</div>
          <div id="host-time-a" class="text-4xl font-teko">45s</div>
        </div>
        <div id="host-card-b" class="p-4 rounded-lg border bg-slate-900 border-slate-800">
          <div id="host-name-b" class="text-sm font-bold">WOJCIECH</div>
          <div id="host-time-b" class="text-4xl font-teko">45s</div>
        </div>
      </div>

      <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 mb-4 grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-gray-400 block mb-1">Gracz A:</label>
          <input type="text" id="input-name-a" value="JAN" oninput="updatePlayersConfig()" class="w-full bg-slate-950 border border-slate-700 p-1.5 rounded text-white font-bold">
        </div>
        <div>
          <label class="text-gray-400 block mb-1">Gracz B:</label>
          <input type="text" id="input-name-b" value="WOJCIECH" oninput="updatePlayersConfig()" class="w-full bg-slate-950 border border-slate-700 p-1.5 rounded text-white font-bold">
        </div>
        <div class="col-span-2 flex gap-2 mt-1">
          <button onclick="resetTimers()" class="w-full bg-slate-800 hover:bg-slate-700 text-gray-200 py-1.5 rounded font-semibold">
            Resetuj czas obu do 45s
          </button>
        </div>
      </div>
    </div>

    <!-- Przyciski Akcji -->
    <div class="space-y-3">
      <button onclick="onCorrect()" class="w-full py-5 bg-green-600 hover:bg-green-500 active:scale-95 text-white font-black text-2xl rounded-xl shadow-lg transition cursor-pointer">
        ✓ DOBRZE [SPACE]
      </button>
      <button onclick="onPass()" class="w-full py-4 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold text-xl rounded-xl shadow transition cursor-pointer">
        PAS [P]
      </button>
      <button id="btn-toggle-run" onclick="toggleRun()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg cursor-pointer">
        START / PAUZA ZEGARA
      </button>
    </div>
  </div>

  <script>
    const QUESTIONS = [
      { id: 1, category: "UKŁAD KRĄŻENIA", image: "https://images.unsplash.com/photo-1559757175-5700dde675bc?auto=format&fit=crop&w=1000&q=80", answer: "Serce / Cor" },
      { id: 2, category: "NEUROANATOMIA", image: "https://images.unsplash.com/photo-1559757148-5c350d0d3c56?auto=format&fit=crop&w=1000&q=80", answer: "Mózgowie / Encephalon" },
      { id: 3, category: "OSTEOLOGIA", image: "https://images.unsplash.com/photo-1530210124550-912dc1381cb8?auto=format&fit=crop&w=1000&q=80", answer: "Kościec / Systema skeletale" }
    ];

    let state = {
      view: 'PROJEKTOR',
      playerA: 'JAN',
      playerB: 'WOJCIECH',
      timeA: 45,
      timeB: 45,
      activePlayer: 'A',
      isRunning: false,
      qIndex: 0
    };

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'CORRECT') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'PASS') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        }
      } catch(e) {}
    }

    const channel = new BroadcastChannel('the_floor_anatomy_channel');

    channel.onmessage = (event) => {
      if (event.data && event.data.type === 'SYNC') {
        state = { ...state, ...event.data.payload };
        updateUI();
      } else if (event.data && event.data.type === 'SOUND') {
        playSound(event.data.payload);
      }
    };

    function broadcastState() {
      channel.postMessage({ type: 'SYNC', payload: state });
      updateUI();
    }

    function broadcastSound(soundType) {
      playSound(soundType);
      channel.postMessage({ type: 'SOUND', payload: soundType });
    }

    setInterval(() => {
      if (state.isRunning) {
        if (state.activePlayer === 'A') {
          if (state.timeA > 0) {
            state.timeA--;
            broadcastState();
          } else {
            state.isRunning = false;
            broadcastSound('PASS');
            broadcastState();
          }
        } else {
          if (state.timeB > 0) {
            state.timeB--;
            broadcastState();
          } else {
            state.isRunning = false;
            broadcastSound('PASS');
            broadcastState();
          }
        }
      }
    }, 1000);

    function setView(viewName) {
      initAudio();
      state.view = viewName;
      document.getElementById('view-projektor').classList.toggle('hidden', viewName !== 'PROJEKTOR');
      document.getElementById('view-host').classList.toggle('hidden', viewName !== 'HOST');
      
      document.getElementById('btn-view-proj').className = viewName === 'PROJEKTOR' 
        ? 'px-3 py-1.5 rounded font-bold bg-yellow-500 text-black' 
        : 'px-3 py-1.5 rounded font-bold text-gray-300 hover:text-white';
      
      document.getElementById('btn-view-host').className = viewName === 'HOST' 
        ? 'px-3 py-1.5 rounded font-bold bg-yellow-500 text-black' 
        : 'px-3 py-1.5 rounded font-bold text-gray-300 hover:text-white';
    }

    function onCorrect() {
      initAudio();
      broadcastSound('CORRECT');
      state.activePlayer = state.activePlayer === 'A' ? 'B' : 'A';
      state.qIndex = (state.qIndex + 1) % QUESTIONS.length;
      state.isRunning = true;
      broadcastState();
    }

    function onPass() {
      initAudio();
      broadcastSound('PASS');
      state.qIndex = (state.qIndex + 1) % QUESTIONS.length;
      broadcastState();
    }

    function toggleRun() {
      initAudio();
      state.isRunning = !state.isRunning;
      broadcastState();
    }

    function updatePlayersConfig() {
      state.playerA = document.getElementById('input-name-a').value.toUpperCase() || 'JAN';
      state.playerB = document.getElementById('input-name-b').value.toUpperCase() || 'WOJCIECH';
      broadcastState();
    }

    function resetTimers() {
      state.timeA = 45;
      state.timeB = 45;
      state.isRunning = false;
      broadcastState();
    }

    window.addEventListener('keydown', (e) => {
      if (state.view === 'HOST') {
        if (e.code === 'Space') {
          e.preventDefault();
          onCorrect();
        } else if (e.code === 'KeyP') {
          onPass();
        }
      }
    });

    function updateUI() {
      const q = QUESTIONS[state.qIndex];

      document.getElementById('proj-img').src = q.image;
      document.getElementById('proj-category').innerText = q.category;
      document.getElementById('proj-name-a').innerText = state.playerA;
      document.getElementById('proj-name-b').innerText = state.playerB;
      document.getElementById('proj-time-a').innerText = state.timeA;
      document.getElementById('proj-time-b').innerText = state.timeB;

      const isAActive = state.activePlayer === 'A' && state.isRunning;
      const isBActive = state.activePlayer === 'B' && state.isRunning;

      document.getElementById('box-player-a').className = `timer-box p-4 rounded-l-2xl relative flex items-center justify-between ${isAActive ? 'timer-active' : ''}`;
      document.getElementById('box-player-b').className = `timer-box p-4 rounded-r-2xl relative flex items-center justify-between flex-row-reverse ${isBActive ? 'timer-active' : ''}`;

      document.getElementById('badge-a').classList.toggle('hidden', !isAActive);
      document.getElementById('badge-b').classList.toggle('hidden', !isBActive);

      document.getElementById('host-answer').innerText = q.answer;
      document.getElementById('host-category').innerText = "KATEGORIA: " + q.category;
      document.getElementById('host-name-a').innerText = state.playerA;
      document.getElementById('host-name-b').innerText = state.playerB;
      document.getElementById('host-time-a').innerText = state.timeA + "s";
      document.getElementById('host-time-b').innerText = state.timeB + "s";

      document.getElementById('host-card-a').className = `p-4 rounded-lg border ${state.activePlayer === 'A' ? 'bg-blue-950 border-yellow-400' : 'bg-slate-900 border-slate-800'}`;
      document.getElementById('host-card-b').className = `p-4 rounded-lg border ${state.activePlayer === 'B' ? 'bg-blue-950 border-yellow-400' : 'bg-slate-900 border-slate-800'}`;
      
      document.getElementById('btn-toggle-run').innerText = state.isRunning ? 'PAUZA ZEGARA' : 'START / WZNOWIENIE';
    }

    updateUI();
  </script>
</body>
</html>
