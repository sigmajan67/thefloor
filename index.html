<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anatomiczne The Floor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #030712;
      color: #ffffff;
      overflow-x: hidden;
      user-select: none;
    }

    .font-teko {
      font-family: 'Teko', sans-serif;
    }

    /* Główna rama ekranu */
    .floor-screen-border {
      border: 4px solid #facc15;
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.4), inset 0 0 20px rgba(0, 0, 0, 0.9);
      transition: all 0.3s ease;
    }

    .screen-correct-glow {
      border-color: #22c55e !important;
      box-shadow: 0 0 50px rgba(34, 197, 94, 0.8), inset 0 0 30px rgba(34, 197, 94, 0.5) !important;
    }

    /* Zintegrowana dolna konsola The Floor */
    .tv-console-container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    /* Górna linia z imionami i kategorią */
    .tv-top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      position: relative;
      z-index: 10;
    }

    .player-name-box {
      background: linear-gradient(180deg, #1d4ed8 0%, #1e3a8a 100%);
      border: 2px solid #3b82f6;
      border-bottom: none;
      padding: 6px 24px;
      font-weight: 900;
      font-size: 1.25rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      box-shadow: 0 -4px 15px rgba(30, 58, 138, 0.5);
    }

    .player-name-left {
      clip-path: polygon(0 0, 88% 0, 100% 100%, 0% 100%);
      text-align: left;
    }

    .player-name-right {
      clip-path: polygon(12% 0, 100% 0, 100% 100%, 0% 100%);
      text-align: right;
    }

    /* Środkowy złoty baner kategorii / odpowiedzi */
    .category-banner {
      clip-path: polygon(10% 0, 90% 0, 100% 100%, 0% 100%);
      background: linear-gradient(180deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
      border-top: 3px solid #fff3a1;
      color: #000000;
      font-weight: 900;
      padding: 8px 48px;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      text-align: center;
      min-width: 320px;
      box-shadow: 0 0 25px rgba(234, 179, 8, 0.6);
      transition: all 0.25s ease;
    }

    .category-banner-correct {
      background: linear-gradient(180deg, #86efac 0%, #22c55e 50%, #15803d 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 0 35px rgba(34, 197, 94, 0.9) !important;
      border-top-color: #bbf7d0 !important;
      transform: scale(1.03);
    }

    /* Dolne bloki licznikowe */
    .tv-bottom-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: #020617;
      padding: 6px;
      border: 3px solid #1e3a8a;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .timer-block {
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
      border: 2px solid #1e40af;
      padding: 8px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    .timer-block-active {
      border-color: #facc15 !important;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.8), inset 0 0 15px rgba(250, 204, 21, 0.2) !important;
      background: linear-gradient(180deg, #1e1b4b 0%, #020617 100%) !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between">

  <!-- PRZEŁĄCZNIK WIDOKU W ROGU EKRANU -->
  <div class="fixed top-2 right-2 z-50 bg-slate-900/90 p-1.5 rounded-lg border border-slate-700 text-xs flex gap-2">
    <button id="btn-view-proj" onclick="setView('PROJEKTOR')" class="px-3 py-1.5 rounded font-bold bg-yellow-500 text-black cursor-pointer">
      Projektor (Widownia)
    </button>
    <button id="btn-view-host" onclick="setView('HOST')" class="px-3 py-1.5 rounded font-bold text-gray-300 hover:text-white cursor-pointer">
      Panel Prowadzącego
    </button>
  </div>

  <!-- 1. WIDOK PROJEKTORA -->
  <div id="view-projektor" class="flex-1 flex flex-col justify-between p-6 max-w-7xl mx-auto w-full relative">
    
    <!-- Centralny Ekran ze Strukturą Anatomiczną -->
    <div class="flex-1 flex items-center justify-center my-2">
      <div id="proj-screen-frame" class="w-full max-w-4xl h-[56vh] bg-blue-950/40 floor-screen-border rounded-xl p-4 relative flex flex-col items-center justify-center overflow-hidden">
        <img id="proj-img" src="" alt="Struktura Anatomiczna" class="max-h-full max-w-full object-contain rounded shadow-2xl">
      </div>
    </div>

    <!-- ZINTEGROWANA DOLNA KONSOLA TV -->
    <div class="tv-console-container">
      
      <!-- Górny Pas: Paweł | KATEGORIA | Jarosław -->
      <div class="tv-top-bar">
        <div class="player-name-box player-name-left">
          <span id="proj-name-a">JAN</span>
        </div>

        <div id="proj-category-banner" class="category-banner">
          <span id="proj-category-text">UKŁAD KRĄŻENIA</span>
        </div>

        <div class="player-name-box player-name-right">
          <span id="proj-name-b">WOJCIECH</span>
        </div>
      </div>

      <!-- Dolny Pas: Zegary Graczy -->
      <div class="tv-bottom-bar">
        <div id="box-player-a" class="timer-block">
          <span id="proj-time-a" class="text-7xl md:text-8xl font-teko font-bold text-white tracking-wider">45</span>
          <span id="badge-a" class="text-yellow-400 font-extrabold animate-pulse text-sm hidden">TWÓJ CZAS</span>
        </div>

        <div id="box-player-b" class="timer-block flex-row-reverse">
          <span id="proj-time-b" class="text-7xl md:text-8xl font-teko font-bold text-white tracking-wider">45</span>
          <span id="badge-b" class="text-yellow-400 font-extrabold animate-pulse text-sm hidden">TWÓJ CZAS</span>
        </div>
      </div>

    </div>

  </div>

  <!-- 2. WIDOK PROWADZĄCEGO (PANEL ARBITRA) -->
  <div id="view-host" class="flex-1 p-6 max-w-2xl mx-auto w-full flex flex-col justify-between hidden">
    <div>
      <h1 class="text-xl font-bold text-yellow-400 mb-4 text-center border-b border-slate-800 pb-2">PANEL ARBITRA / PROWADZĄCEGO</h1>
      
      <div class="bg-slate-900 border-2 border-yellow-500/50 rounded-xl p-4 mb-4 text-center">
        <span class="text-xs text-gray-400 uppercase tracking-widest block mb-1">Poprawna Odpowiedź:</span>
        <div id="host-answer" class="text-2xl font-black text-green-400">---</div>
        <span id="host-category" class="text-xs text-yellow-500 mt-2 block">---</span>
      </div>

      <div class="grid grid-cols-2 gap-4 mb-4 text-center">
        <div id="host-card-a" class="p-4 rounded-lg border bg-slate-900 border-slate-800">
          <div id="host-name-a" class="text-sm font-bold">JAN</div>
          <div id="host-time-a" class="text-4xl font-teko">45s</div>
        </div>
        <div id="host-card-b" class="p-4 rounded-lg border bg-slate-900 border-slate-800">
          <div id="host-name-b" class="text-sm font-bold">WOJCIECH</div>
          <div id="host-time-b" class="text-4xl font-teko">45s</div>
        </div>
      </div>

      <div class="bg-slate-900/80 p-3 rounded-lg border border-slate-800 mb-4 grid grid-cols-2 gap-2 text-xs">
        <div>
          <label class="text-gray-400 block mb-1">Gracz A:</label>
          <input type="text" id="input-name-a" value="JAN" oninput="updatePlayersConfig()" class="w-full bg-slate-950 border border-slate-700 p-1.5 rounded text-white font-bold">
        </div>
        <div>
          <label class="text-gray-400 block mb-1">Gracz B:</label>
          <input type="text" id="input-name-b" value="WOJCIECH" oninput="updatePlayersConfig()" class="w-full bg-slate-950 border border-slate-700 p-1.5 rounded text-white font-bold">
        </div>
        <div class="col-span-2 flex gap-2 mt-1">
          <button onclick="resetTimers()" class="w-full bg-slate-800 hover:bg-slate-700 text-gray-200 py-1.5 rounded font-semibold cursor-pointer">
            Resetuj czas obu do 45s
          </button>
        </div>
      </div>
    </div>

    <div class="space-y-3">
      <button onclick="onCorrect()" class="w-full py-5 bg-green-600 hover:bg-green-500 active:scale-95 text-white font-black text-2xl rounded-xl shadow-lg transition cursor-pointer">
        ✓ DOBRZE [SPACE]
      </button>
      <button onclick="onPass()" class="w-full py-4 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold text-xl rounded-xl shadow transition cursor-pointer">
        PAS [P]
      </button>
      <button id="btn-toggle-run" onclick="toggleRun()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg cursor-pointer">
        START / PAUZA ZEGARA
      </button>
    </div>
  </div>

  <script>
    const SVG_HEART = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ef4444'><path d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/></svg>";
    const SVG_BRAIN = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 2a9 9 0 0 0-9 9c0 3.87 2.46 7.16 5.92 8.42.33.12.58.41.58.76v.32c0 .83.67 1.5 1.5 1.5h2c.83 0 1.5-.67 1.5-1.5v-.32c0-.35.25-.64.58-.76C18.54 18.16 21 14.87 21 11a9 9 0 0 0-9-9z'/></svg>";
    const SVG_BONE = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23eab308'><path d='M19 8.5c0-.83-.67-1.5-1.5-1.5a1.5 1.5 0 0 0-1.12.5L13 11l-3.5-3.5a1.5 1.5 0 0 0 .5-1.12A1.5 1.5 0 0 0 8.5 4.88a1.5 1.5 0 0 0-1.5 1.5c0 .33.11.64.29.9L4 10.5A1.5 1.5 0 0 0 3.5 12a1.5 1.5 0 0 0 .5 1.12l3.29 3.29c-.18.26-.29.57-.29.9 0 .83.67 1.5 1.5 1.5a1.5 1.5 0 0 0 1.12-.5L13 15l3.5 3.5c-.18.26-.29.57-.29.9 0 .83.67 1.5 1.5 1.5a1.5 1.5 0 0 0 1.5-1.5c0-.42-.17-.8-.44-1.08L21 15.5A1.5 1.5 0 0 0 21.5 14a1.5 1.5 0 0 0-.5-1.12l-2-2z'/></svg>";

    const QUESTIONS = [
      { id: 1, category: "UKŁAD KRĄŻENIA", image: SVG_HEART, answer: "Serce / Cor" },
      { id: 2, category: "NEUROANATOMIA", image: SVG_BRAIN, answer: "Mózgowie / Encephalon" },
      { id: 3, category: "OSTEOLOGIA", image: SVG_BONE, answer: "Kościec / Systema skeletale" }
    ];

    let state = {
      view: 'PROJEKTOR',
      playerA: 'JAN',
      playerB: 'WOJCIECH',
      timeA: 45,
      timeB: 45,
      activePlayer: 'A',
      isRunning: false,
      qIndex: 0,
      showCorrectAnswer: false,
      lastAnswerText: ''
    };

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'CORRECT') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.3);
        } else if (type === 'PASS') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, audioCtx.currentTime);
          osc.frequency.setValueAtTime(110, audioCtx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        }
      } catch(e) {}
    }

    const channel = new BroadcastChannel('the_floor_anatomy_channel');

    channel.onmessage = (event) => {
      if (event.data && event.data.type === 'SYNC') {
        state = { ...state, ...event.data.payload };
        updateUI();
      } else if (event.data && event.data.type === 'SOUND') {
        playSound(event.data.payload);
      }
    };

    function broadcastState() {
      channel.postMessage({ type: 'SYNC', payload: state });
      updateUI();
    }

    function broadcastSound(soundType) {
      playSound(soundType);
      channel.postMessage({ type: 'SOUND', payload: soundType });
    }

    setInterval(() => {
      if (state.isRunning && !state.showCorrectAnswer) {
        if (state.activePlayer === 'A') {
          if (state.timeA > 0) {
            state.timeA--;
            broadcastState();
          } else {
            state.isRunning = false;
            broadcastSound('PASS');
            broadcastState();
          }
        } else {
          if (state.timeB > 0) {
            state.timeB--;
            broadcastState();
          } else {
            state.isRunning = false;
            broadcastSound('PASS');
            broadcastState();
          }
        }
      }
    }, 1000);

    function setView(viewName) {
      initAudio();
      state.view = viewName;
      
      const projEl = document.getElementById('view-projektor');
      const hostEl = document.getElementById('view-host');
      
      if (projEl && hostEl) {
        if (viewName === 'PROJEKTOR') {
          projEl.classList.remove('hidden');
          hostEl.classList.add('hidden');
        } else {
          projEl.classList.add('hidden');
          hostEl.classList.remove('hidden');
        }
      }

      const btnProj = document.getElementById('btn-view-proj');
      const btnHost = document.getElementById('btn-view-host');

      if (btnProj && btnHost) {
        btnProj.className = viewName === 'PROJEKTOR' 
          ? 'px-3 py-1.5 rounded font-bold bg-yellow-500 text-black cursor-pointer' 
          : 'px-3 py-1.5 rounded font-bold text-gray-300 hover:text-white cursor-pointer';
        
        btnHost.className = viewName === 'HOST' 
          ? 'px-3 py-1.5 rounded font-bold bg-yellow-500 text-black cursor-pointer' 
          : 'px-3 py-1.5 rounded font-bold text-gray-300 hover:text-white cursor-pointer';
      }
    }

    // Akcja po kliknięciu DOBRZE
    function onCorrect() {
      initAudio();
      broadcastSound('CORRECT');

      const currentQ = QUESTIONS[state.qIndex];
      state.showCorrectAnswer = true;
      state.lastAnswerText = currentQ.answer;
      broadcastState();

      // Animacja zielonego błysku i przejście do kolejnego pytania
      setTimeout(() => {
        state.showCorrectAnswer = false;
        state.activePlayer = state.activePlayer === 'A' ? 'B' : 'A';
        state.qIndex = (state.qIndex + 1) % QUESTIONS.length;
        state.isRunning = true;
        broadcastState();
      }, 1200);
    }

    function onPass() {
      initAudio();
      broadcastSound('PASS');
      state.qIndex = (state.qIndex + 1) % QUESTIONS.length;
      broadcastState();
    }

    function toggleRun() {
      initAudio();
      state.isRunning = !state.isRunning;
      broadcastState();
    }

    function updatePlayersConfig() {
      const inpA = document.getElementById('input-name-a');
      const inpB = document.getElementById('input-name-b');
      if (inpA && inpB) {
        state.playerA = inpA.value.toUpperCase() || 'JAN';
        state.playerB = inpB.value.toUpperCase() || 'WOJCIECH';
        broadcastState();
      }
    }

    function resetTimers() {
      state.timeA = 45;
      state.timeB = 45;
      state.isRunning = false;
      broadcastState();
    }

    window.addEventListener('keydown', (e) => {
      if (state.view === 'HOST') {
        if (e.code === 'Space') {
          e.preventDefault();
          onCorrect();
        } else if (e.code === 'KeyP') {
          onPass();
        }
      }
    });

    function
